# Application Configuration
spring.application.name=NetGuard AI
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/netguard_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed.origins=http://localhost:5173,http://localhost:3000

# AI Prediction Configuration
# The project works without the optional Python ML service.
# The built-in Spring Boot AI/risk engine is used by default.
# Set ml.service.enabled=true only if you also start ml-service.
# ML Service Configuration
ml.service.url=http://localhost:5000
ml.service.enabled=false

# Alert Correlation Configuration
correlation.time.window.minutes=5
correlation.min.score=60

# Logging
logging.level.com.netguard.ai=INFO
logging.level.org.hibernate.SQL=WARN
